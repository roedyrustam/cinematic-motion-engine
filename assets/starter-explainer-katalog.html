<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Motion Pro v2.1 — Katalog Putih &amp; Isometric Exploded Studio Starter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --cyclorama-white: #F8F9FA;
      --surface-card: #FFFFFF;
      --ink-carbon: #0F141C;
      --ink-slate: #475569;
      --accent-orange: #FF4F18;
      --accent-cobalt: #1D4ED8;
      --accent-highlight: #DCFCE7;
      --hairline: rgba(15, 20, 28, 0.08);
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #090C10;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: var(--cyclorama-white);
      overflow: hidden;
      transform-origin: 50% 50%;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
    }

    .safe {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }

    #world {
      position: absolute;
      inset: -1400px;
      width: 4720px;
      height: 3880px;
      transform-origin: 50% 50%;
      will-change: transform, filter;
    }

    /* Surface Layer 1: Precision Studio Millimeter Hairline Grid */
    #studio-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--hairline) 1px, transparent 1px),
        linear-gradient(to bottom, var(--hairline) 1px, transparent 1px);
      background-size: 96px 96px;
      pointer-events: none;
    }

    /* Surface Layer 2: Orbital Calibration Rings */
    #calibration-svg {
      position: absolute;
      left: 1400px;
      top: 1400px;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }

    #dom {
      position: absolute;
      left: 1400px;
      top: 1400px;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }

    .beat-zone {
      position: absolute;
    }

    .spec-tag {
      font-family: var(--font-mono);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent-orange);
      text-transform: uppercase;
      margin-bottom: 16px;
      display: inline-block;
    }

    .catalog-hero {
      font-family: var(--font-sans);
      font-size: 124px;
      font-weight: 800;
      line-height: 0.94;
      letter-spacing: -0.04em;
      color: var(--ink-carbon);
      font-variant-numeric: tabular-nums;
    }

    .catalog-sub {
      font-family: var(--font-sans);
      font-size: 46px;
      font-weight: 700;
      line-height: 1.12;
      color: var(--ink-slate);
      margin-top: 20px;
    }

    .iso-stack {
      position: relative;
      width: 560px;
      height: 420px;
      transform-style: preserve-3d;
      transform: rotateX(56deg) rotateZ(-38deg);
    }

    .iso-layer {
      position: absolute;
      inset: 0;
      background: var(--surface-card);
      border: 2px solid var(--ink-carbon);
      border-radius: 16px;
      box-shadow: -18px 24px 38px rgba(15, 20, 28, 0.12);
      padding: 28px 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .iso-label {
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 700;
      color: var(--ink-carbon);
    }

    .iso-metric {
      font-family: var(--font-sans);
      font-size: 64px;
      font-weight: 800;
      color: var(--accent-cobalt);
      font-variant-numeric: tabular-nums;
    }

    .spec-card {
      background: var(--surface-card);
      border: 2px solid var(--ink-carbon);
      border-radius: 14px;
      padding: 32px 42px;
      box-shadow: 0 22px 48px rgba(15, 20, 28, 0.08);
      margin-top: 28px;
      display: inline-block;
    }

    #debug-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 20, 28, 0.92);
      color: #F8F9FA;
      padding: 8px 18px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 14px;
      display: none;
      gap: 12px;
      align-items: center;
      z-index: 9999;
    }

    #debug-bar.active {
      display: flex;
    }
  </style>
</head>

<body>
  <!-- SVG Directional Motion Blur Pool -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="mb-world" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur id="mb-world-node" in="SourceGraphic" stdDeviation="0 0" />
      </filter>
    </defs>
  </svg>

  <div id="stage">
    <div class="safe" id="safe-wrap">
      <div id="world">
        <div id="studio-grid"></div>

        <!-- Surface Layer 2: Precision Isometric Calibration Rings -->
        <svg id="calibration-svg" viewBox="0 0 1920 1080">
          <g id="cal-ring-1" transform="translate(1320, 540)">
            <circle cx="0" cy="0" r="360" fill="none" stroke="rgba(15,20,28,0.12)" stroke-width="1.5"
              stroke-dasharray="10 8" />
            <circle cx="0" cy="0" r="240" fill="none" stroke="rgba(255,79,24,0.22)" stroke-width="1.5" />
          </g>
        </svg>

        <div id="dom">
          <!-- BEAT 1: Landmark at (960, 540) — Exploded Isometric Hardware/Architecture Stack -->
          <div class="beat-zone" id="zone-1" style="left: 160px; top: 190px; width: 920px;">
            <div class="spec-tag" id="k1-tag">[SPEC 01 · ZERO-LATENCY ARCHITECTURE]</div>
            <div class="catalog-hero" id="k1-hero">0.42ms<br />EDGE SYNC</div>
            <div class="catalog-sub" id="k1-sub">Tiga lapisan komputasi terisolasi secara deterministik.</div>
          </div>

          <div class="beat-zone" id="iso-zone" style="left: 1120px; top: 310px;">
            <div class="iso-stack" id="iso-stack">
              <div class="iso-layer" id="layer-bottom" style="background:#F1F5F9;">
                <span class="iso-label">L1 · STORAGE ENGINE</span>
                <span class="iso-metric">NVMe RAID</span>
              </div>
              <div class="iso-layer" id="layer-mid" style="background:#FFFFFF;">
                <span class="iso-label">L2 · DETERMINISTIC BUS</span>
                <span class="iso-metric">120 GB/s</span>
              </div>
              <div class="iso-layer" id="layer-top" style="background:#FFF7ED; border-color:#FF4F18;">
                <span class="iso-label">L3 · ZERO-COPY EDGE API</span>
                <span class="iso-metric" style="color:#FF4F18;">99.999%</span>
              </div>
            </div>
          </div>

          <!-- BEAT 2: Landmark at (2880, 540) — Tabular Benchmark Specification -->
          <div class="beat-zone" id="zone-2" style="left: 2140px; top: 210px; width: 1480px;">
            <div class="spec-tag" id="k2-tag">[SPEC 02 · VERIFIED BENCHMARK]</div>
            <div class="catalog-hero" id="k2-hero">14.8x LEBIH HEMAT</div>
            <div class="spec-card" id="k2-card">
              <div class="iso-label">THROUGHPUT PER NODE</div>
              <div class="catalog-hero" style="font-size:108px; color:var(--accent-cobalt); margin-top:8px;">480,000 RPS
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="debug-bar">
    <button id="debug-toggle">PAUSE</button>
    <input type="range" id="debug-scrub" min="0" max="8" step="0.01" value="0" style="width:260px" />
    <span id="debug-time">0.00s / 8.00s</span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const isClean = params.get('clean') === '1';
    const isDebug = params.get('debug') === '1';
    const ratio = params.get('ratio') || '16x9';

    let W = 1920, H = 1080;
    const stageEl = document.getElementById('stage');
    const safeWrap = document.getElementById('safe-wrap');

    if (ratio === '9x16') {
      W = 1080; H = 1920;
      stageEl.style.width = '1080px';
      stageEl.style.height = '1920px';
      safeWrap.style.transform = 'scale(0.78)';
    } else if (ratio === '1x1') {
      W = 1080; H = 1080;
      stageEl.style.width = '1080px';
      stageEl.style.height = '1080px';
      safeWrap.style.transform = 'scale(0.86)';
    }

    const DURATION = 8.0;
    const FPS = 60;
    const BEATS = [0.25, 0.95, 1.8, 2.8, 3.6, 4.3, 5.1, 6.2, 7.5];

    function fitViewport() {
      if (isClean) {
        stageEl.style.transform = 'none';
        return;
      }
      const s = Math.min(window.innerWidth / W, window.innerHeight / H);
      stageEl.style.transform = `scale(${s.toFixed(4)})`;
    }
    window.addEventListener('resize', fitViewport);
    fitViewport();

    const worldEl = document.getElementById('world');
    const blurNode = document.getElementById('mb-world-node');
    const cam = { x: 0, y: 0, z: 1, rot: 0 };

    function applyCam() {
      worldEl.style.transform = `translate3d(${cam.x.toFixed(2)}px, ${cam.y.toFixed(2)}px, 0) scale(${cam.z.toFixed(4)}) rotate(${cam.rot.toFixed(3)}deg)`;
    }
    function setWorldBlur(dx, dy) {
      if (dx <= 0.1 && dy <= 0.1) {
        blurNode.setAttribute('stdDeviation', '0 0');
        worldEl.style.filter = 'none';
      } else {
        worldEl.style.filter = 'url(#mb-world)';
        blurNode.setAttribute('stdDeviation', `${dx.toFixed(1)} ${dy.toFixed(1)}`);
      }
    }
    function calcShot(wx, wy, z = 1) {
      return { x: -(wx - 960) * z, y: -(wy - 540) * z, z };
    }
    function into(tl, at, wx, wy, z = 1.15, rot = 0, dur = 0.26) {
      const target = calcShot(wx, wy, z);
      const dx = Math.min(38, Math.abs(target.x - cam.x) * 0.022);
      const dy = Math.min(26, Math.abs(target.y - cam.y) * 0.022);
      tl.call(() => setWorldBlur(dx, dy), null, at);
      tl.to(cam, { x: target.x, y: target.y, z: target.z, rot, duration: dur, ease: 'expo.in', onUpdate: applyCam }, at);
    }
    function settle(tl, at, wx, wy, z = 1.0, rot = 0, dur = 0.28) {
      const target = calcShot(wx, wy, z);
      tl.to(cam, {
        x: target.x, y: target.y, z: target.z, rot,
        duration: dur, ease: 'expo.out', onUpdate: applyCam,
        onComplete: () => setWorldBlur(0, 0)
      }, at);
      tl.call(() => setWorldBlur(0, 0), null, at + dur);
    }
    function look(tl, at, wx, wy, z = 1.05, dur = 1.8, rot = 0) {
      const target = calcShot(wx, wy, z);
      tl.to(cam, { x: target.x, y: target.y, z: target.z, rot, duration: dur, ease: 'sine.inOut', onUpdate: applyCam }, at);
    }
    function home(tl, at, dur = 0.55) {
      tl.to(cam, { x: 0, y: 0, z: 1, rot: 0, duration: dur, ease: 'power3.inOut', onUpdate: applyCam }, at);
    }

    // Phrase Accretion Helpers
    function slam(tl, sel, at, dur = 0.30) {
      tl.fromTo(sel, { y: -70, scale: 1.25, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: dur, ease: 'back.out(1.6)' }, at);
    }
    function block(tl, sel, at, dur = 0.34) {
      tl.fromTo(sel, { clipPath: 'inset(0 100% 0 0)', autoAlpha: 1 }, { clipPath: 'inset(0 0% 0 0%)', duration: dur, ease: 'expo.out' }, at);
    }

    const calRing = document.getElementById('cal-ring-1');
    const tl = gsap.timeline({
      paused: isClean,
      repeat: isClean ? 0 : -1
    });
    tl.eventCallback('onUpdate', () => {
      const t = tl.time();
      calRing.setAttribute('transform', `translate(1320, 540) rotate(${(t * 14).toFixed(2)})`);
      if (isDebug) {
        document.getElementById('debug-scrub').value = t;
        document.getElementById('debug-time').textContent = `${t.toFixed(2)}s / ${DURATION.toFixed(2)}s`;
      }
    });

    // Beat 1: Phrase Accretion + Isometric Exploded Stack Separation
    block(tl, '#k1-tag', 0.12);
    slam(tl, '#k1-hero', 0.32);
    block(tl, '#k1-sub', 0.65);

    tl.fromTo('#layer-bottom', { z: 0, y: 0 }, { z: -90, y: 75, duration: 0.75, ease: 'expo.out' }, 0.45);
    tl.fromTo('#layer-mid', { z: 0, y: 0 }, { z: 10, y: 0, duration: 0.75, ease: 'expo.out' }, 0.55);
    tl.fromTo('#layer-top', { z: 0, y: 0 }, { z: 110, y: -85, duration: 0.75, ease: 'expo.out' }, 0.65);
    look(tl, 0.2, 1020, 520, 1.06, 3.2, -0.5);

    // Whip-Pan to Beat 2 at (2840, 520)
    into(tl, 3.60, 2840, 520, 1.18, -2.5, 0.26);
    settle(tl, 3.86, 2840, 520, 1.02, 0, 0.28);
    block(tl, '#k2-tag', 3.92);
    slam(tl, '#k2-hero', 4.14);
    slam(tl, '#k2-card', 4.48);
    look(tl, 4.20, 2880, 510, 1.07, 2.8, 0.6);

    // Return Home for clean loop
    home(tl, 7.35, 0.65);

    window.OPENER = {
      W, H, DURATION, FPS, RATIO: ratio, BEATS, tl,
      ready: true,
      clipsReady: () => Promise.resolve(true),
      seek(t) {
        tl.pause();
        tl.time(Math.max(0, Math.min(DURATION, t)));
        applyCam();
      },
      async seekFrame(t) {
        this.seek(t);
        await new Promise((r) => requestAnimationFrame(r));
      },
      play() { tl.play(0); }
    };
  </script>
</body>

</html>
