<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Motion Pro v2.0 — Narrative Explainer Starter (Aksi Kontinu &amp; Phrase Accretion)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg-studio: #F6F3EC;
      --ink-primary: #111318;
      --ink-muted: #525866;
      --accent-vermilion: #E63926;
      --accent-cobalt: #1D4ED8;
      --accent-highlighter: #FFE14D;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0B0D12;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: var(--bg-studio);
      overflow: hidden;
      transform-origin: 50% 50%;
    }

    #world {
      position: absolute;
      inset: -1400px;
      width: 4720px;
      height: 3880px;
      transform-origin: 50% 50%;
      will-change: transform, filter;
    }

    /* Surface Layer 1: Engineering Millimeter Grid */
    #grid-surface {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(17, 19, 24, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17, 19, 24, 0.06) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    #dom {
      position: absolute;
      left: 1400px;
      top: 1400px;
      width: 1920px;
      height: 1080px;
    }

    .beat-zone {
      position: absolute;
    }

    .tag-mono {
      font-family: var(--font-mono);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent-cobalt);
      text-transform: uppercase;
      margin-bottom: 18px;
      display: inline-block;
    }

    .giant-number {
      font-family: var(--font-sans);
      font-size: 164px;
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: var(--ink-primary);
      font-variant-numeric: tabular-nums;
    }

    .accreted-clause {
      font-family: var(--font-sans);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink-primary);
      margin-top: 18px;
      position: relative;
      display: inline-block;
    }

    .highlight-bar {
      position: absolute;
      inset: 6px -10px 2px -10px;
      background: var(--accent-highlighter);
      mix-blend-mode: multiply;
      z-index: 1;
      transform-origin: 0% 50%;
      transform: scaleX(0);
    }

    .ui-card {
      margin-top: 32px;
      width: 760px;
      padding: 32px;
      background: #FFFFFF;
      border: 2px solid var(--ink-primary);
      box-shadow: 12px 12px 0 var(--ink-primary);
      font-family: var(--font-mono);
      font-size: 36px;
      color: var(--ink-primary);
    }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="mb-world" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur id="mb-world-node" in="SourceGraphic" stdDeviation="0 0" />
      </filter>
    </defs>
  </svg>

  <div id="stage">
    <div id="world">
      <div id="grid-surface"></div>
      <div id="dom">
        <!-- Paragraph 1 Zone at (960, 540) — Phrase Accretion (4 elements) -->
        <div id="zone-p1" class="beat-zone" style="left: 160px; top: 160px; width: 1600px;">
          <div id="p1-tag" class="tag-mono">[SEG 01 // LATENCY BOTTLENECK]</div>
          <div id="p1-slam" class="giant-number">840 MS</div>
          <div style="display:block">
            <span id="p1-block" class="accreted-clause">
              Terbuang setiap kali kueri menunggu cold-start
              <span id="p1-mark" class="highlight-bar"></span>
            </span>
          </div>
          <div id="p1-card" class="ui-card" data-wx="540" data-wy="740">
            STATUS: <strong style="color:var(--accent-vermilion)">COLD CONTAINER LOCKED</strong>
          </div>
        </div>

        <!-- Paragraph 2 Zone at (2680, 540) -->
        <div id="zone-p2" class="beat-zone" style="left: 1980px; top: 180px; width: 1520px;">
          <div id="p2-tag" class="tag-mono">[SEG 02 // EDGE WARM POOL]</div>
          <div id="p2-slam" class="giant-number" style="color:var(--accent-cobalt)">12 MS</div>
          <div style="display:block">
            <span id="p2-block" class="accreted-clause">
              Instan menyala dengan replikasi snapshot memori.
              <span id="p2-mark" class="highlight-bar"></span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const W = 1920, H = 1080, FPS = 60;
    const params = new URLSearchParams(window.location.search);
    const isClean = params.get('clean') === '1';

    // Voiceover Paragraph & Clause Timing Contract (Extracted via vo-fft-analyzer.html)
    const PARA = [
      { id: 'p1', start: 0.0, end: 4.4, wx: 960, wy: 540 },
      { id: 'p2', start: 4.8, end: 9.0, wx: 2740, wy: 540 }
    ];
    const SEG = [
      { id: 's1', at: 0.15, action: 'tag' },
      { id: 's2', at: 0.55, action: 'slam' },
      { id: 's3', at: 1.25, action: 'block' },
      { id: 's4', at: 1.95, action: 'multiply' },
      { id: 's5', at: 2.55, action: 'camToCard' }
    ];
    const DURATION = 9.0;

    const stageEl = document.getElementById('stage');
    function fitStage() {
      const s = Math.min(window.innerWidth / W, window.innerHeight / H);
      stageEl.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    const worldEl = document.getElementById('world');
    const worldBlurNode = document.getElementById('mb-world-node');
    const cam = { x: 0, y: 0, z: 1, rot: 0 };

    function applyCam() {
      worldEl.style.transform = `translate3d(${cam.x.toFixed(2)}px, ${cam.y.toFixed(2)}px, 0) scale(${cam.z.toFixed(4)}) rotate(${cam.rot.toFixed(3)}deg)`;
    }
    function setWorldBlur(dx, dy) {
      if (dx <= 0.1 && dy <= 0.1) {
        worldBlurNode.setAttribute('stdDeviation', '0 0');
        worldEl.style.filter = 'none';
      } else {
        worldEl.style.filter = 'url(#mb-world)';
        worldBlurNode.setAttribute('stdDeviation', `${dx.toFixed(1)} ${dy.toFixed(1)}`);
      }
    }
    function calcShot(wx, wy, z = 1) {
      return { x: -(wx - W / 2) * z, y: -(wy - H / 2) * z, z };
    }
    function into(tl, at, wx, wy, z = 1.15, rot = 0, dur = 0.25) {
      const target = calcShot(wx, wy, z);
      const dx = Math.min(36, Math.abs(target.x - cam.x) * 0.02);
      const dy = Math.min(24, Math.abs(target.y - cam.y) * 0.02);
      tl.call(() => setWorldBlur(dx, dy), null, at);
      tl.to(cam, { x: target.x, y: target.y, z: target.z, rot, duration: dur, ease: 'expo.in', onUpdate: applyCam }, at);
    }
    function settle(tl, at, wx, wy, z = 1.0, rot = 0, dur = 0.28) {
      const target = calcShot(wx, wy, z);
      tl.to(cam, {
        x: target.x, y: target.y, z: target.z, rot,
        duration: dur, ease: 'expo.out', onUpdate: applyCam,
        onComplete: () => setWorldBlur(0, 0)
      }, at);
      tl.call(() => setWorldBlur(0, 0), null, at + dur);
    }

    // Phrase Accretion Helpers: slam, block, multiply
    function slam(tl, sel, at, dur = 0.30) {
      tl.fromTo(sel, { y: -80, scale: 1.35, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: dur, ease: 'back.out(1.7)' }, at);
    }
    function block(tl, sel, at, dur = 0.36) {
      tl.fromTo(sel, { clipPath: 'inset(0 100% 0 0)', autoAlpha: 1 }, { clipPath: 'inset(0 0% 0 0)', duration: dur, ease: 'expo.out' }, at);
    }
    function multiply(tl, sel, at, dur = 0.34) {
      tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: 'power3.out' }, at);
    }

    const tl = gsap.timeline({ paused: isClean, repeat: isClean ? 0 : -1 });

    // Paragraph 1 Phrase Accretion (4 elements building sequentially)
    block(tl, '#p1-tag', SEG[0].at, 0.3);
    slam(tl, '#p1-slam', SEG[1].at, 0.32);
    block(tl, '#p1-block', SEG[2].at, 0.38);
    multiply(tl, '#p1-mark', SEG[3].at, 0.35);
    slam(tl, '#p1-card', 2.25, 0.30);

    // Interactive UI Camera Zoom onto the Status Card
    into(tl, SEG[4].at, 640, 720, 1.42, -1.2, 0.24);
    settle(tl, SEG[4].at + 0.24, 640, 720, 1.48, 0, 0.28);

    // Silence Gap Transition (4.4s -> 4.8s) to Paragraph 2 Zone
    into(tl, PARA[0].end, PARA[1].wx, PARA[1].wy, 1.18, 2.5, 0.24);
    settle(tl, PARA[0].end + 0.24, PARA[1].wx, PARA[1].wy, 1.0, 0, 0.26);

    // Paragraph 2 Phrase Accretion
    block(tl, '#p2-tag', 4.95, 0.3);
    slam(tl, '#p2-slam', 5.30, 0.32);
    block(tl, '#p2-block', 5.85, 0.38);
    multiply(tl, '#p2-mark', 6.45, 0.35);

    // Return to Home
    into(tl, 8.40, 960, 540, 1.05, 0, 0.26);
    settle(tl, 8.66, 960, 540, 1.0, 0, 0.30);

    window.OPENER = {
      W, H, DURATION, FPS, tl, ready: true,
      clipsReady: () => Promise.resolve(true),
      seek(t) {
        tl.pause();
        tl.time(Math.max(0, Math.min(DURATION, t)));
        applyCam();
      },
      async seekFrame(t) {
        this.seek(t);
        await new Promise((r) => requestAnimationFrame(r));
      },
      play() { tl.play(0); }
    };
  </script>
</body>

</html>
